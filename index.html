<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estantería Esperpentia</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 40px; }
    h1 { text-align: center; margin-bottom: 30px; }
    .estanteria { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .revista { background: #fff; border: 1px solid #ddd; padding: 10px; width: 220px; text-align: center; box-shadow: 2px 2px 6px rgba(0,0,0,0.1); }
    .revista img { width: 100%; height: auto; margin-bottom: 10px; }
    .revista a { display: inline-block; padding: 8px 12px; background: #0073e6; color: #fff; text-decoration: none; border-radius: 4px; }
    .revista a:hover { background: #005bb5; }
  </style>
</head>
<body>
  <h1>Revistas Esperpentia</h1>
  <div class="estanteria">
    <div class="revista">
      <img src="img/esperpentia-n1.jpg" alt="Esperpentia N°1">
      <a href="https://heyzine.com/flip-book/revista1" target="_blank">Abrir revista</a>
    </div>
    <div class="revista">
      <img src="img/esperpentia-n3.jpg" alt="Esperpentia N°3">
      <a href="https://heyzine.com/flip-book/revista3" target="_blank">Abrir revista</a>
    </div>
  </div>
</body>
</html
